[project]
name = "backend"
version = "0.1.0"
description = "week 3 backend service"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.28.0",
    "python-dotenv>=1.0.1",
    "google-genai>=2.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A"]
ignore = ["E501", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
