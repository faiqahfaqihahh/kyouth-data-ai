[project]
name = "backend"
version = "0.1.0"
requires-python = "==3.14.4"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.48.0",
    "python-dotenv==1.2.2",
    "anthropic==0.104.1",
    "pydantic==2.13.4",
]

[tool.uv]
required-version = ">=0.8,<0.9"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
