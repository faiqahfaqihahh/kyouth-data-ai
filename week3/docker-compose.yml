services:

  backend:
    build: ./backend
    container_name: week3_backend
    env_file: .env
    ports:
      - "8001:8001"
    networks:
      - app-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: week3_frontend
    environment:
      - BACKEND_URL=http://backend:8001
    ports:
      - "8000:8000"
    networks:
      - app-net
    depends_on:
      - backend
    restart: unless-stopped

networks:
  app-net:
    driver: bridge
