version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8001:8001"
    environment:
      - DB_URL=src/week_2/resources/jobs_d1.db
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    ports:
      - "8000:8000"
    environment:
      - BACKEND_URL=http://localhost:8001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
