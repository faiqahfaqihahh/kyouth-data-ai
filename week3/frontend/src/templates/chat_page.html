<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --surface:   #141720;
      --border:    #242836;
      --accent:    #5cffb1;
      --accent2:   #ff6b6b;
      --text:      #e8eaf0;
      --muted:     #5a5f75;
      --user-bg:   #1e2235;
      --bot-bg:    #131825;
      --radius:    14px;
      --font-head: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── Layout ── */
    .shell {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100dvh;
      max-width: 860px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .logo-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.5; transform:scale(.75); }
    }
    header h1 {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: -.5px;
    }
    header h1 span { color: var(--accent); }
    .badge {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 2px 10px;
    }

    /* ── Upload bar ── */
    .upload-bar {
      padding: 10px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .upload-bar label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 5px 12px;
      transition: border-color .2s, color .2s;
    }
    .upload-bar label:hover { border-color: var(--accent); color: var(--accent); }
    .upload-bar input[type=file] { display: none; }
    #file-name {
      font-size: 11px;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }
    #clear-file {
      font-size: 11px;
      color: var(--accent2);
      background: none;
      border: none;
      cursor: pointer;
      display: none;
    }

    /* ── Messages ── */
    #messages {
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 78%;
      animation: fadeUp .25s ease both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(8px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .msg.user  { align-self: flex-end; align-items: flex-end; }
    .msg.bot   { align-self: flex-start; align-items: flex-start; }
    .msg.error { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user  .bubble { background: var(--user-bg); border: 1px solid var(--border); border-bottom-right-radius: 4px; }
    .msg.bot   .bubble { background: var(--bot-bg);  border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.error .bubble { background: #2a1010; border: 1px solid var(--accent2); color: var(--accent2); border-bottom-left-radius: 4px; }

    .role-label {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .msg.user .role-label { color: var(--accent); }

    /* thinking indicator */
    .typing span {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: blink 1.2s ease-in-out infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink {
      0%,80%,100% { opacity:.2; transform:scale(.9); }
      40%          { opacity:1;  transform:scale(1.15); }
    }

    /* ── Input area ── */
    .input-area {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #user-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      padding: 10px 14px;
      resize: none;
      min-height: 44px;
      max-height: 160px;
      outline: none;
      transition: border-color .2s;
      line-height: 1.5;
      overflow-y: auto;
    }
    #user-input:focus { border-color: var(--accent); }
    #user-input::placeholder { color: var(--muted); }

    #send-btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      width: 44px; height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .15s, transform .1s;
    }
    #send-btn:hover  { background: #7fffca; }
    #send-btn:active { transform: scale(.94); }
    #send-btn:disabled { background: var(--border); cursor: not-allowed; }
    #send-btn svg { width:18px; height:18px; }

    /* ── Empty state ── */
    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--muted);
    }
    .empty-state .big { font-family: var(--font-head); font-size: 2.2rem; font-weight: 800; color: var(--border); margin-bottom: 8px; }
    .empty-state p { font-size: 12px; }
  </style>
</head>
<body>
<div class="shell">

  <!-- Header -->
  <header>
    <div class="logo-dot"></div>
    <h1>AI<span>Chat</span></h1>
    <span class="badge">week 3 · microservices</span>
  </header>

  <!-- PDF upload bar -->
  <div class="upload-bar">
    <label>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Attach PDF
      <input type="file" id="pdf-input" accept="application/pdf" />
    </label>
    <span id="file-name"></span>
    <button id="clear-file">✕ remove</button>
  </div>

  <!-- Messages -->
  <div id="messages">
    <div class="empty-state">
      <div class="big">···</div>
      <p>Send a message to start the conversation.</p>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <textarea id="user-input" placeholder="Type a message…" rows="1"></textarea>
    <button id="send-btn" title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

</div>

<script>
  const BACKEND_URL = "{{ backend_url }}";
  const messagesEl  = document.getElementById("messages");
  const inputEl     = document.getElementById("user-input");
  const sendBtn     = document.getElementById("send-btn");
  const pdfInput    = document.getElementById("pdf-input");
  const fileNameEl  = document.getElementById("file-name");
  const clearFileBtn = document.getElementById("clear-file");

  let pdfText = "";
  let emptyState = messagesEl.querySelector(".empty-state");

  /* ── Auto-grow textarea ── */
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  });

  /* ── Send on Enter (Shift+Enter = newline) ── */
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  sendBtn.addEventListener("click", sendMessage);

  /* ── PDF handling ── */
  pdfInput.addEventListener("change", async () => {
    const file = pdfInput.files[0];
    if (!file) return;
    fileNameEl.textContent = file.name;
    clearFileBtn.style.display = "inline";
    pdfText = await extractPdfText(file);
  });

  clearFileBtn.addEventListener("click", () => {
    pdfInput.value = "";
    fileNameEl.textContent = "";
    clearFileBtn.style.display = "none";
    pdfText = "";
  });

  async function extractPdfText(file) {
    /* Send raw base64 to backend; backend will handle text extraction.
       For a lightweight approach we just send the raw text read as data URL. */
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result); // data URL
      reader.onerror = () => resolve("");
      reader.readAsText(file); // works for text-based PDFs; backend handles binary
    });
  }

  /* ── Render helpers ── */
  function addMessage(role, text) {
    if (emptyState) { emptyState.remove(); emptyState = null; }
    const wrap = document.createElement("div");
    wrap.className = `msg ${role}`;

    const label = document.createElement("div");
    label.className = "role-label";
    label.textContent = role === "user" ? "you" : role === "error" ? "error" : "assistant";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    wrap.appendChild(label);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addTypingIndicator() {
    if (emptyState) { emptyState.remove(); emptyState = null; }
    const wrap = document.createElement("div");
    wrap.className = "msg bot";
    wrap.id = "typing-indicator";

    const label = document.createElement("div");
    label.className = "role-label";
    label.textContent = "assistant";

    const bubble = document.createElement("div");
    bubble.className = "bubble typing";
    bubble.innerHTML = "<span></span><span></span><span></span>";

    wrap.appendChild(label);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  /* ── Send message ── */
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;

    addMessage("user", text);
    const indicator = addTypingIndicator();

    try {
      const res = await fetch(`${BACKEND_URL}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, pdf_text: pdfText }),
      });

      indicator.remove();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        addMessage("error", err.detail || `Server error ${res.status}`);
      } else {
        const data = await res.json();
        addMessage("bot", data.response || "(empty response)");
      }
    } catch (err) {
      indicator.remove();
      addMessage("error", `Could not reach backend: ${err.message}`);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }
</script>
</body>
</html>
