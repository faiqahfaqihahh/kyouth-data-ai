<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        .chat-box {
            height: 400px;
            overflow-y: auto;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
        }
        .message {
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            max-width: 75%;
        }
        .user-message {
            background-color: #0d6efd;
            color: white;
            margin-left: auto;
        }
        .bot-message {
            background-color: #e9ecef;
            color: #212529;
            margin-right: auto;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0">Resume Helper Chatbot</h4>
                    </div>
                    <div class="card-body">
                        
                        <div class="mb-4 p-3 bg-light border rounded">
                            <label for="resumeUpload" class="form-label fw-bold">📎 Attach Resume (PDF Format)</label>
                            <input class="form-control" type="file" id="resumeUpload" accept=".pdf">
                            <div id="uploadStatus" class="form-text text-muted mt-1">No file uploaded yet.</div>
                        </div>

                        <div class="chat-box p-3 mb-3" id="chatBox">
                            <div class="message bot-message">
                                Hello! Please upload your resume and type an instruction or prompt to begin your analysis.
                            </div>
                        </div>

                        <div class="input-group">
                            <input type="text" id="userInput" class="form-control" placeholder="Type your prompt here..." aria-label="User prompt">
                            <button class="btn btn-primary" type="button" id="sendBtn">Send Message</button>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set up PDF.js worker path
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        // Injected dynamically via Jinja2 from environment configuration
        const BACKEND_URL = "{{ backend_url }}";

        let extractedPdfText = "";

        // Client-side PDF extraction module
        document.getElementById('resumeUpload').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            const statusDiv = document.getElementById('uploadStatus');
            
            if (!file) return;

            statusDiv.className = "form-text text-primary fw-bold";
            statusDiv.innerText = "Processing and extracting text from PDF...";

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = "";

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(" ");
                    fullText += pageText + "\n";
                }

                extractedPdfText = fullText.trim();
                statusDiv.className = "form-text text-success fw-bold";
                statusDiv.innerText = `Successfully parsed! Extracted ${extractedPdfText.length} characters of clean text.`;
            } catch (error) {
                console.error(error);
                statusDiv.className = "form-text text-danger fw-bold";
                statusDiv.innerText = "Error parsing PDF structure. Please check file format constraints.";
            }
        });

        // Chat orchestration logic
        document.getElementById('sendBtn').addEventListener('click', async () => {
            const inputEl = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const prompt = inputEl.value.trim();

            if (!prompt) return;

            // 1. Append User Message to UI
            appendMessage(prompt, 'user-message');
            inputEl.value = '';

            // 2. Formulate Structured JSON Payload for the API 
            const payload = {
                message: prompt,
                pdf_text: extractedPdfText
            };

            // Temporary visual indicator for response pending status
            const loadingId = appendMessage("Thinking...", 'bot-message');

            try {
                // 3. Forward request over network infrastructure to Backend
                const response = await fetch(`${BACKEND_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload),
                    signal: AbortSignal.timeout(120000) // 2 minute timeout
                });

                if (!response.ok) throw new Error(`HTTP network fault code: ${response.status}`);

                const data = await response.json();
                
                // 4. Render extracted chatbot insights back onto view
                document.getElementById(loadingId).innerText = data.reply;
            } catch (error) {
                console.error(error);
                document.getElementById(loadingId).innerText = "Failed to fetch response. Ensure the backend endpoint is running and reachable.";
                document.getElementById(loadingId).classList.add("text-danger");
            }
        });

        function appendMessage(text, className) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            const uniqueId = 'msg-' + Date.now();
            msgDiv.id = uniqueId;
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return uniqueId;
        }
    </script>
</body>
</html>
