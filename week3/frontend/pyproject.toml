[project]
name = "frontend"
version = "0.1.0"
requires-python = "==3.14.5"
dependencies = [
    "fastapi==0.136.3",
    "jinja2==3.1.6",
    "uvicorn==0.48.0",
    "python-dotenv==1.2.2",
]

[tool.uv]
required-version = ">=0.8,<0.9"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
