[project]
name = "week-2"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastmcp==2.3.4",
    "google-genai==1.16.0",
    "ollama==0.4.8",
    "pydantic==2.11.4",
    "python-dotenv==1.1.0",
]


[dependency-groups]
dev = [
    "ruff==0.15.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
